[package]
name = "sok"
version = "0.3.0"
edition = "2021"
description = "Rust CLI for the Structure of Knowledge agent skill"
license = "MIT"

[[bin]]
name = "sok"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = "0.4"
csv = "1.3"
hex = "0.4"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
url = "2.5"

[dev-dependencies]
tempfile = "3.10"
