name: structure-of-knowledge
version: 0.3.0
purpose: >
  Evidence-grounded harness for mapping an unfamiliar field into its knowledge
  structure, source roles, and a reader-fit artifact architecture, with learning
  or frontier modules only when the goal requires them.
target_learner:
  default: learner_or_downstream_agent
  assumptions:
    - audience_and_goal_are_explicit
    - domain_precision_is_preserved
    - needs_field_structure_not_a_flat_topic_list
stages:
  - id: frame
    objective: Define field, learner, goal, scope, and a provisional domain profile.
    required_artifacts:
      - research_frame
      - assumptions
      - domain_decomposition
      - domain_profile_hypothesis
  - id: source_stack
    objective: Gather and rank sources by epistemic and pedagogical role rather than fixed source quotas.
    required_artifacts:
      - source_role_probe
      - evidence_matrix
      - source_layer_map
  - id: structure_extraction
    objective: Extract field-native elements, their actual forms, roles, and load-bearing relations.
    required_artifacts:
      - field_element_inventory
      - load_bearing_relations
  - id: architecture_design
    objective: Compare organizing forms and choose a source-grounded, reader-fit narrative architecture.
    required_artifacts:
      - organizing_form_comparison
      - report_architecture_decision
  - id: curriculum_design
    condition: user_goal_requires_learning_path
    objective: Build a spiral or networked curriculum from field entry to the intended level of fluency.
    required_artifacts:
      - curriculum_roadmap
      - reading_ladder
      - practice_artifacts
  - id: frontier_mapping
    condition: user_goal_requires_current_or_research_frontier
    objective: Identify current open problems, debates, schools, and research opportunities.
    required_artifacts:
      - frontier_map
      - debate_map
  - id: delivery
    objective: Produce a field-specific ordered narrative, relation-backed visuals when useful, citations, and verification notes.
    required_artifacts:
      - narrative_report
      - sources
    conditional_artifacts:
      visual_package: chosen_architecture_benefits_from_relation_backed_visuals
quality_gates:
  - id: not_topic_list
    rule: Output explains load-bearing relations, its chosen organizing form, and inquiry methods; hierarchy, network structure, or progression appear only when they fit the field and goal.
  - id: technical_integrity
    rule: Output preserves the field's concepts, warrants, and uncertainty while adapting explanation to the intended audience.
  - id: sourced_currentness
    rule: Current claims include source dates and distinguish durable foundations from frontier claims.
  - id: actionable_access
    rule: Recommended sources include type, identifier, access route, free or paid status, and budget estimate or library guidance.
  - id: pedagogical_ladder
    condition: user_goal_requires_reading_or_curriculum_path
    rule: Literature is assigned a pedagogical role, not merely listed.
  - id: preserved_report_structure
    rule: Final-report exports preserve ordered narrative sections plus any declared machine surfaces without forcing those surfaces into the public table of contents.
  - id: evidence_support_semantics
    rule: Only reviewed or verified supports evidence with reviewed_at plus locator or support_note can satisfy claim support; cataloged, qualifies, contradicts, background, and example links remain visible but non-supporting.
  - id: strict_final_validation
    rule: Strict validation fails on embedded export warnings or errors, dangling endpoints, missing substantial-report structure without a structure waiver, public/internal boundary leaks, weak evidence semantics, and undated currentness claims.
  - id: domain_fit
    rule: Field-name lenses are provisional; reviewed elements and relations determine whether the report uses prerequisites, systems, processes, cases, debates, chronology, scale, or another justified form.
  - id: architecture_fit
    rule: The report records why its organizing form and section sequence best convey the core ideas and necessary surrounding elements for the reader's goal.
  - id: source_role_fit
    rule: Source baskets are diagnostic roles, not quotas; conditional roles may be waived only with rationale tied to field structure and user goal.
  - id: curriculum_not_boundary
    rule: Existing curricula and syllabi count as evidence of stabilized pedagogical consensus, not as the boundary of the field.
outputs:
  internal_scaffold_markdown: optional_agent_artifact
  human_report_markdown: required_for_final_report_lane
  sources_manifest: required
  evidence_jsonl: optional_until_final_claim_support
  json_report: required_structured_source_of_truth
  html_interactive_report: optional_view_for_validated_human_report
  graph_views: optional_structured_views_selected_from_relations
  core_sidecars: optional_typed_machine_lane_inputs
  run_manifest: optional_private_reproducibility_sidecar
  work_order_result_sidecars: optional_private_bounded_work_exchange
  declarative_discovery_profiles:
    reference: structure-of-knowledge/references/discovery-profiles.v1.json
    rule: Profile inference and projection keyword mappings are versioned advisory data. Generated or explicit profile proposals remain provisional until source review and may be revised.
    unknown_locale_fallback: Unknown locales or unmatched profile signals use the open profile and must not silently assign formal, interpretive, or infrastructure semantics.
    stable_markdown_surface: Language-neutral sok: markers remain the structured Markdown interface; localized prose terms are only parsing aids where declared.
  structured_markdown_surfaces:
    note: Canonical headings remain compatible; standalone, recognized sok:surface markers outside code fences allow field-specific public titles. Unknown or empty sok directives and duplicate markers are blocking diagnostics.
    report_architecture: "report-architecture marker with Executive thesis, Chosen organizing form, and Architecture rationale"
    field_elements: "field-elements marker with Element class, Observed element, Actual form in this field, Role, Load-bearing relations, Source IDs, Confidence"
    field_element_export: "report.field_elements preserves free-form field-native classes before compatibility projection; relations may use field_element endpoints"
    literature_ladder: "literature-ladder marker with Layer, Start here, Read for, Do not infer, Source IDs"
    relations: "relations marker with Relation ID, Relation kind, From type/reference, To type/reference, Rationale, Source IDs"
    curriculum_prerequisites: "curriculum marker with Prerequisite IDs or Prerequisites when a multi-step curriculum is present"
    visual_views: "visual-views marker with View ID, View kind, Title, Purpose, Relation IDs, Node emphasis"
    claims: "claims marker with Statement, Claim type, Evidence requirement, Source IDs, Confidence, Temporal status, Notes"
agent_cli:
  language: rust
  manifest: cli/Cargo.toml
  package: cli/src
  run_from_source: cargo run --locked --manifest-path cli/Cargo.toml --bin sok --
  build: make build
  development_binary: cli/target/release/sok
  installed_binary: ${CODEX_HOME}/skills/structure-of-knowledge/bin/sok
  installed_binary_windows: ${CODEX_HOME}\skills\structure-of-knowledge\bin\sok.exe
  implementation_check: sok --version must end with "(rust)"
  install_skill: make install
  default_download_statuses:
    - open_access
    - free_web
    - public_domain
    - cc_by
    - cc_by_sa
    - official_open
    - user_provided
  default_download_policy: >
    paid_book, paywalled, subscription, restricted, unknown, and missing
    access_status values are metadata-only unless an explicit downloader flag
    permits them; flags do not grant legal access to restricted content.
  commands:
    init: Create an agent workspace with brief, tasks, report scaffold, source manifest, downloads, notes, and logs.
    brief: Generate a standalone agent handoff brief.
    scaffold: Generate a source-review and report-architecture discovery canvas with a provisional field-name lens.
    handoff-report: Wrap a scaffold in next-agent instructions for completing a polished human-reader report.
    source-template: Create a CSV source manifest template.
    audit-sources: Validate access metadata and source role or relevance fields.
    download-sources: Download only sources with default-allowed access statuses by default.
    ingest last: Normalize this run's source manifest into cataloged evidence JSONL without creating a persistent ledger.
    lint: Stage-aware pre-export check for Markdown, source manifests, and optional evidence ledgers.
    export-json: Convert bounded scaffold or final Markdown plus source/evidence files into sok-report.json, with optional typed core sidecars for the machine lane.
    validate-report: Validate sok-report.json schema, public/internal boundary, evidence, currentness, source-role, and relation gates.
    migrate-ids: Write a deterministic old-to-new stable ID map for readable sok-report/v1 and sok-report/v2 artifacts without rewriting the input.
    eval conformance: Score saved provider-neutral conformance fixtures without model or network calls.
    work: Validate and exchange provider-neutral WorkOrder and WorkResult sidecars as proposed patches against core packages.
    render-html: Render a validated human_report JSON file into self-contained local HTML.
    specificity: Generate a concreteness checklist for underspecified domain tasks.
  workflow_lanes:
    scaffold:
      intent: Internal agent scaffold; not a finished report.
      commands:
        - source-template
        - ingest last
        - scaffold
        - lint --stage scaffold
        - export-json --stage scaffold
      outputs:
        - scaffold.md
        - sources.csv
        - evidence.jsonl
        - sok-scaffold.json
      render_html: false
      public_boundary: internal_context allowed only outside the public report payload
    final_report:
      intent: Human-facing report generated from field-specific ordered Markdown, with reviewed evidence when claims require it.
      commands:
        - lint --stage final
        - export-json --stage final
        - validate-report --strict
      optional_commands:
        render-html: requested_output_includes_html
      inputs:
        - field-specific human report Markdown with a report architecture decision
        - sources.csv
      conditional_inputs:
        reviewed evidence JSONL: report_contains_claims_requiring_reviewed_support
      outputs:
        - sok-report.json
      conditional_outputs:
        report.html: requested_output_includes_html
      structured_surfaces_when_applicable:
        - Relations for substantial field-structure claims
        - Claims that require reviewed support
        - Literature Ladder when the goal includes a reading path
        - Curriculum prerequisites when a multi-step curriculum is present
        - Visual Views when visual intent is declared
      strict_validation_expectations:
        - sok-report/v2 human reports include both presentation and field_elements; v1 omission is legacy-only
        - the Report Architecture surface has a non-empty executive thesis, chosen organizing form, architecture rationale, and rejected alternative with rationale
        - a non-empty field-element inventory grounds the presentation in observed field forms
        - no embedded export warnings or errors unless accepted loss is waived
        - relation endpoints, visual nodes and edges, literature sources, claim sources, and curriculum prerequisites resolve to public report entities
        - substantial final reports keep load-bearing relations; multi-step curricula keep at least one prerequisite unless structure_waivers explain the omission
        - reviewed or verified claim support uses support_kind supports with reviewed_at plus locator or support_note
      public_boundary: internal_context and diagnostics are not rendered
  quality_gate_commands:
    - make fmt
    - make test
    - make vet
    - make build
    - cli/target/release/sok --version
    - cli/target/release/sok --help
  modes:
    research: Field-structured SoK report; add literature, frontier, curriculum, or visual modules only when the goal and architecture require them.
    textbook: Textbook thesis, chapter architecture, exercise ladder, and permissions plan.
    model-tuning: Legal corpus plan, access audit, exclusion list, and evaluation blueprint.
    curriculum: Module roadmap, practice artifacts, and scholarly assessment.
