name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    name: Build CLI archive
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: linux-amd64
            binary: sok
            archive: tar
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: linux-arm64
            binary: sok
            archive: tar
          - os: macos-13
            target: x86_64-apple-darwin
            artifact: darwin-amd64
            binary: sok
            archive: tar
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: darwin-arm64
            binary: sok
            archive: tar
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: windows-amd64
            binary: sok.exe
            archive: zip
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            artifact: windows-arm64
            binary: sok.exe
            archive: zip
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          name="sok-${GITHUB_REF_NAME}-${{ matrix.artifact }}"
          package_dir="dist/${name}"
          mkdir -p "$package_dir"

          crate_version="$(sed -n 's/^version = "\(.*\)"$/\1/p' cli/Cargo.toml | head -n 1)"
          spec_version="$(sed -n 's/^version: //p' specs/sok-harness.yaml | head -n 1)"
          test -n "$crate_version"
          test "$crate_version" = "$spec_version"
          if [ "$GITHUB_REF_NAME" != "v$crate_version" ]; then
            echo "release tag $GITHUB_REF_NAME does not match CLI version v$crate_version" >&2
            exit 1
          fi

          cd cli
          cargo build --release --locked --target "${{ matrix.target }}" --bin sok
          cd ..

          cp "cli/target/${{ matrix.target }}/release/${{ matrix.binary }}" "$package_dir/"
          cp README.md "$package_dir/"
          cp LICENSE "$package_dir/"
          test -f "$package_dir/${{ matrix.binary }}"

          if [ "${{ matrix.target }}" != "aarch64-pc-windows-msvc" ]; then
            "$package_dir/${{ matrix.binary }}" --version | grep -E '\(rust\)$'
          fi

          if [ "${{ matrix.archive }}" = "zip" ]; then
            (cd dist && 7z a "${name}.zip" "$name")
          else
            (cd dist && tar -czf "${name}.tar.gz" "$name")
          fi

      - name: Upload packaged binary
        uses: actions/upload-artifact@v7
        with:
          name: sok-${{ matrix.artifact }}
          path: dist/*

  publish:
    name: Publish release
    runs-on: ubuntu-latest
    needs: package

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download packaged binaries
        uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Flatten binary artifacts
        shell: bash
        run: |
          set -euo pipefail
          find dist -mindepth 2 -type f -exec mv {} dist/ \;
          find dist -mindepth 1 -type d -empty -delete

      - name: Archive skill folder
        shell: bash
        run: |
          set -euo pipefail

          tar -czf "dist/structure-of-knowledge-${GITHUB_REF_NAME}.tar.gz" \
            LICENSE README.md structure-of-knowledge
          zip -r "dist/structure-of-knowledge-${GITHUB_REF_NAME}.zip" LICENSE README.md structure-of-knowledge

          listing="$(tar -tzf "dist/structure-of-knowledge-${GITHUB_REF_NAME}.tar.gz")"
          if grep -E '(^|/)cli/|(^|/)target/|structure-of-knowledge/(bin/|Cargo\.(toml|lock)$|src/)' <<<"$listing"; then
            echo "source-only skill archive contains CLI sources, Cargo files, or build artifacts" >&2
            exit 1
          fi

      - name: Upload GitHub release artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --title "$tag" --generate-notes
          fi
